; ============================================================
; Kalyber Scanner — configuración PlatformIO
;
; Placa: ESP32-S3-1-N16R8 (16MB flash / 8MB PSRAM)
; "esp32-s3-devkitc-1" es el board genérico compatible.
;
; DOS VARIANTES DE HARDWARE — dos formas de elegirla:
;
;  A) Método simple (recomendado si compilás con el botón de VS Code):
;     copiar variantes/config_variant_DESKTOP.h  (o _TALLER_MINI.h)
;     a src/config_variant.h y compilar el env por defecto.
;
;  B) Método por entorno (recomendado para fabricar en serie):
;     `pio run -e desktop -t upload`      → scanner/simulador completo
;     `pio run -e taller-mini -t upload`  → caja mínima solo scanner
;     (los build_flags pisan lo que diga src/config_variant.h)
; ============================================================

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SH110X @ ^2.1.11
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.0.4

; Entorno por defecto (compatible con el flujo anterior): usa lo que
; diga src/config_variant.h (que por defecto es DESKTOP)
[env:kalyber-scanner]

; Scanner/Simulador de escritorio completo (OLED + simulador + RS485)
[env:desktop]
build_flags = ${env.build_flags} -DVARIANT_DESKTOP

; Caja mínima de taller: solo scanner, sin OLED, alimentada por OBD
[env:taller-mini]
build_flags = ${env.build_flags} -DVARIANT_TALLER_MINI

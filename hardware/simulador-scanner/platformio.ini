; ============================================================
; Kalyber Scanner/Simulador — configuración PlatformIO
;
; Placa: ESP32-S3-1-N16R8 (16MB flash / 8MB PSRAM)
; Si tu variante concreta tiene otro nombre de board en PlatformIO,
; buscala en https://docs.platformio.org/en/latest/boards/index.html#espressif32
; — "esp32-s3-devkitc-1" es el genérico más común y funciona bien
; para placas N16R8 sin pines especiales.
; ============================================================
[env:kalyber-scanner]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SH110X @ ^2.1.11
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.0.4
